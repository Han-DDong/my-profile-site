<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#5b21b6"/>
    </linearGradient>
    <linearGradient id="avatar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- 브라우저 창 -->
  <rect x="90" y="60" width="620" height="330" rx="16" fill="#0b0b14" stroke="#ffffff" stroke-opacity="0.12"/>
  <circle cx="120" cy="86" r="5" fill="#f87171"/>
  <circle cx="138" cy="86" r="5" fill="#fbbf24"/>
  <circle cx="156" cy="86" r="5" fill="#34d399"/>
  <rect x="200" y="78" width="380" height="16" rx="8" fill="#1e1e33"/>

  <!-- 프로필 영역 -->
  <circle cx="220" cy="190" r="60" fill="url(#avatar)"/>
  <text x="220" y="206" font-family="Inter, Noto Sans KR, sans-serif" font-size="44" font-weight="800" fill="#ffffff" text-anchor="middle">홍</text>
  <rect x="310" y="158" width="220" height="22" rx="6" fill="#e2e8f0"/>
  <rect x="310" y="194" width="300" height="10" rx="5" fill="#64748b"/>
  <rect x="310" y="212" width="260" height="10" rx="5" fill="#64748b"/>

  <!-- 기술 태그 -->
  <rect x="310" y="240" width="70" height="22" rx="11" fill="#6366f1" fill-opacity="0.85"/>
  <rect x="390" y="240" width="80" height="22" rx="11" fill="#6366f1" fill-opacity="0.6"/>
  <rect x="480" y="240" width="60" height="22" rx="11" fill="#6366f1" fill-opacity="0.4"/>

  <!-- 하단 프로젝트 카드 -->
  <rect x="120" y="300" width="170" height="70" rx="10" fill="#1a1a2e" stroke="#ffffff" stroke-opacity="0.08"/>
  <rect x="315" y="300" width="170" height="70" rx="10" fill="#1a1a2e" stroke="#ffffff" stroke-opacity="0.08"/>
  <rect x="510" y="300" width="170" height="70" rx="10" fill="#1a1a2e" stroke="#ffffff" stroke-opacity="0.08"/>
  <rect x="134" y="316" width="90" height="10" rx="5" fill="#a78bfa"/>
  <rect x="134" y="334" width="130" height="8" rx="4" fill="#475569"/>
  <rect x="329" y="316" width="90" height="10" rx="5" fill="#a78bfa"/>
  <rect x="329" y="334" width="130" height="8" rx="4" fill="#475569"/>
  <rect x="524" y="316" width="90" height="10" rx="5" fill="#a78bfa"/>
  <rect x="524" y="334" width="130" height="8" rx="4" fill="#475569"/>
